# 这样恋爱可不可以 — local run.
#
#   docker compose up --build
#
# Phones, projector and setup page: open everything by the laptop's LAN address
# (ipconfig getifaddr en0), e.g. http://192.168.x.x:8520/screen — never
# localhost. The join QR encodes the origin of the page that draws it.
#
# Nothing is stored on disk. Votes, /admin edits and uploads vanish when the
# container restarts, so author the real scenarios in
# content/questions.source.json, then: npm run content && docker compose up --build.
# Pictures that must survive a restart go in frontend/public/media/.
name: love-opinion-poll

services:
  app:
    build: .
    image: love-opinion-poll:local
    ports:
      - "${HOST_PORT:-8520}:8080"
    environment:
      # The image sets NODE_ENV=production, where an empty key 401s every admin
      # route. Set a real one in .env before an event: every phone in the room
      # is on the same Wi-Fi as the operator console.
      ADMIN_KEY: ${ADMIN_KEY:-dev}
      # Empty means the deck baked into the image. /app/deck.test.json gives
      # 2-second questions for scripts/smoke.sh.
      DECK_FILE: ${DECK_FILE:-}
    healthcheck:
      test:
        - CMD
        - node
        - "-e"
        - 'fetch("http://127.0.0.1:8080/health").then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))'
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
