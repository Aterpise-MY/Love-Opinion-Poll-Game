# Run the checks, and only if every one of them passes: build the image, push
# it to ECR, and roll the Deployment on EKS onto it.
#
# Two jobs, and the order is the whole design. `ci` is ci.yml, called as it
# stands — the same six checks a pull request gets, run on the commit that is
# about to ship. `deploy` needs it, so one red check ends the run before
# anything here has asked AWS for a credential. A merge is not evidence that
# the checks passed: master can be pushed to without a pull request, and two
# green pull requests can still combine into a tree neither of them tested.
#
# Terraform is deliberately not involved. This workflow changes one field on
# the Deployment that is already there — the container image — so it can
# deploy code without holding the state file, and infrastructure changes stay
# a human, laptop-side decision.
#
# It also does nothing at all until the repository has been pointed at a
# cluster. The deploy job is skipped while the EKS_CLUSTER variable is unset,
# so a repository whose stack does not exist yet runs the checks, goes green,
# and does not fail every push on a role it has no way to assume.
#
# READ THIS BEFORE A SHOW: every push to master deploys. A rolling update runs
# two image versions side by side until it finishes, and a phone that loaded
# index.html from an old pod will 404 on its asset from a new one. Freeze
# deploys two hours out — disable this workflow, or protect the `production`
# environment with a required reviewer.

name: build and deploy

on:
  push:
    branches: [master]
    # Docs never change the image, and a rolling deploy is never free.
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - "infra/**"
  workflow_dispatch:

# One rollout at a time. Two pushes a minute apart would otherwise have two
# rolling deployments fighting each other for capacity on the same service.
# Never cancel in flight: a half-finished rollout is worse than a slow one.
#
# On the whole run rather than on the deploy job, and that is a choice. A
# job's group is joined when the job becomes ready, which here is when its
# checks finish — and a group keeps one waiting entry, the latest to arrive,
# cancelling the one before it. So of two runs queued behind a rollout, the
# survivor would be whichever finished its checks LAST, and that can be the
# older commit. A run's group is joined when the run is created: runs go in
# push order and the one left waiting is always the newest. The price is that
# a second push does not start its checks until the rollout ahead of it is
# done.
#
# Do not put this group on the deploy job as well. The run already holds it,
# and a job waiting on a group its own run is holding is a deadlock that
# GitHub resolves by cancelling the run.
concurrency:
  group: deploy-eks
  cancel-in-progress: false

# The floor for every job, and all that the checks get. The one permission
# that matters is granted on the deploy job alone.
permissions:
  contents: read

jobs:
  # ci.yml, exactly as a pull request runs it: content, backend tests, frontend
  # build, lint and format, terraform, image build. Nothing is passed in. With no
  # `secrets:` here the called jobs see no repository secret, and with
  # contents: read as the whole grant none of them can request an OIDC token —
  # a called workflow cannot hold a permission its calling job does not.
  ci:
    # workflow_dispatch can be aimed at any branch from the Actions page. Only
    # master ships, so on anything else there is nothing for these to gate.
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: build → ECR → EKS
    # All six, or nothing. One failed or cancelled check and `ci` has not
    # succeeded, and a job whose need did not succeed is skipped — it is never
    # queued, never asks for the environment, and never reaches the step that
    # requests a token.
    needs: ci
    # success() is what `needs` already implies; it is written out so that the
    # ref test beside it cannot be read as replacing it. The ref test repeats
    # the one on `ci` on purpose, so that this job's refusal to ship a branch
    # does not hang on another job's condition.
    #
    # It is a guard against a mis-aimed manual run, not a security boundary: a
    # branch carries its own copy of this file and can delete the line. What
    # actually stops a branch deploying is a deployment-branch rule on the
    # `production` environment, which lives in the repository settings.
    #
    # The third test is the switch described at the top of this file: no
    # cluster named, nothing to deploy to. EKS_CLUSTER arrives with the other
    # repository variables from `terraform output github_actions_setup`, so
    # setting them is what turns deploys on.
    if: success() && github.ref == 'refs/heads/master' && vars.EKS_CLUSTER != ''
    # x86, because the image runs on Fargate under EKS, which has no Arm
    # option. An Arm runner with QEMU produces the same image, but this
    # Dockerfile runs two `npm ci` passes and a Vite build — emulated that is
    # minutes, native it is under one.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production

    # The only job in this workflow that can request an OIDC token, and so the
    # only one that can become the deploy role. Job-level permissions replace
    # the workflow's rather than adding to them, hence contents: read again —
    # the checkout needs it.
    permissions:
      contents: read
      id-token: write

    steps:
      # Straight to the build. The content check and the unit tests that used
      # to open this job ran a moment ago in `ci`, on this same commit — both
      # jobs check out github.sha — and the content check runs a third time
      # inside the image build (Dockerfile step 1). Dropping them here is not
      # only tidying: this is the job that can mint a token, and it no longer
      # runs `npm ci` on the runner, where a dependency's install script would
      # execute with everything this job can reach.
      - uses: actions/checkout@v4

      # Timestamp first so tags sort chronologically in the ECR console, short
      # SHA second so a running task can be traced back to a commit. ECR is
      # image_tag_mutability = IMMUTABLE, so this must be unique per run —
      # a bare ${{ github.sha }} would make "re-run job" fail on a tag that
      # already exists.
      - name: Compute image tag
        id: tag
        run: echo "value=$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.tag.outputs.value }}
          # Both off. This action defaults provenance on, which wraps the
          # image in an OCI index beside an attestation manifest. Nothing in
          # this stack reads attestations, and one plain manifest for one
          # platform is the shape that never surprises whatever pulls it.
          provenance: false
          sbom: false
          # The `image` check wrote this same cache, from this same commit,
          # minutes ago — see the note on its build step in ci.yml. So this is
          # normally that build replayed from cache and pushed. The write stays
          # for the runs where it is not: a re-run of this job alone, days
          # later, after the entries have been evicted.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fetches the cluster's endpoint and certificate, and writes a kubeconfig
      # that asks the AWS CLI for a token on each call. This is the one thing
      # IAM lets the role do to the cluster (eks:DescribeCluster). What it may
      # do once inside is a Kubernetes Role in infra/github-oidc.tf: read and
      # patch Deployments in one namespace, read pods, and no Secrets.
      - name: Point kubectl at the cluster
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER }}" \
            --region "${{ vars.AWS_REGION }}"

      # One field changes: the container's image. Everything else about the
      # Deployment stays as Terraform last wrote it, so this cannot silently
      # revert a setting someone changed there.
      - name: Set the new image
        run: |
          kubectl --namespace "${{ vars.K8S_NAMESPACE }}" set image \
            "deployment/${{ vars.K8S_DEPLOYMENT }}" \
            "${{ vars.K8S_CONTAINER }}=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.tag.outputs.value }}"

      # This is the step that makes a green run mean something. It blocks
      # until the new pods are serving — the namespace has readiness gates, so
      # that is "healthy at the load balancer", not merely "started" — and it
      # exits non-zero when the timeout passes first. A Fargate pod takes a
      # minute or two to appear before its container even starts, hence ten.
      #
      # A step of its own, apart from the one above, so that the undo below
      # can tell "the rollout stalled" from "the image was never set".
      - name: Wait for the rollout
        id: rollout
        run: |
          kubectl --namespace "${{ vars.K8S_NAMESPACE }}" rollout status \
            "deployment/${{ vars.K8S_DEPLOYMENT }}" --timeout=10m

      # Kubernetes does not roll back by itself. A bad image stalls with the
      # old pods still serving — the Deployment retires nothing until its
      # replacements are ready — and stays stalled until somebody acts. This
      # is that somebody. The job still ends red: the wait failed, and this
      # only puts the Deployment back.
      #
      # Tied to the wait's own failure, not to failure() alone. Without the
      # second test a failure anywhere earlier would arrive here too, and
      # `rollout undo` on a Deployment that was never changed does not do
      # nothing: it steps back to the revision before the one that is running.
      - name: Undo a stalled rollout
        if: failure() && steps.rollout.conclusion == 'failure'
        run: |
          kubectl --namespace "${{ vars.K8S_NAMESPACE }}" rollout undo \
            "deployment/${{ vars.K8S_DEPLOYMENT }}"

      # The ALB only checks /health, which deliberately touches nothing. This
      # asks the deployed app whether its dependencies are actually wired up.
      - name: Check /ready
        if: vars.SITE_URL != ''
        run: |
          set -euo pipefail
          echo "deployed ${{ steps.tag.outputs.value }}"
          curl --fail --silent --show-error --max-time 10 \
            "${{ vars.SITE_URL }}/ready" | tee /dev/stderr | grep -q '"ok":true'
